<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
*{font-family:'Inter',sans-serif;box-sizing:border-box}
.fb-box{max-width:750px;margin:20px auto;padding:0;background:#fff;border-radius:18px;overflow:hidden;border:1px solid #e2e8f0;box-shadow:0 10px 30px rgba(0,0,0,0.06)}
.fb-header{background:linear-gradient(135deg,#0866ff 0%,#0444a6 100%);padding:22px 24px;color:#fff;text-align:center}
.fb-header h1{margin:0;font-size:22px;font-weight:700}
.fb-header p{margin:6px 0 0 0;opacity:0.9;font-size:13px}
.fb-body{padding:22px}
.fb-input-wrap{display:flex;gap:10px;background:#f1f5f9;padding:8px;border-radius:12px;border:1px solid #e2e8f0}
.fb-input-wrap input{flex:1;border:none;background:transparent;padding:10px 12px;outline:none;font-size:15px}
.fb-btn{padding:12px 22px;background:#0866ff;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;white-space:nowrap}
.fb-btn:disabled{opacity:0.6}
#fbResult{margin-top:20px}
.fb-card{display:flex;gap:14px;padding:14px;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc}
.fb-card img{width:160px;height:90px;object-fit:cover;border-radius:10px;background:#ddd}
.fb-dl{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.fb-dl button{flex:1;padding:12px;background:#0866ff;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer}
.fb-dl button.sd{background:#10b981}
.fb-dl button:disabled{opacity:0.6}
.fb-how{margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fb-how div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px;text-align:center}
.fb-how b{display:block;margin-bottom:4px}
@media(max-width:600px){.fb-how{grid-template-columns:1fr}.fb-card{flex-direction:column}.fb-card img{width:100%;height:180px}.fb-input-wrap{flex-direction:column}}
.error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:12px;border-radius:10px;font-size:13px}
.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;padding:12px;border-radius:10px;font-size:13px}
</style>
</head>
<body>

<div class="fb-box">
  <div class="fb-header">
    <h1>FullyTool Facebook Video Downloader</h1>
    <p>Download FB Videos, Reels, fb.watch in HD - Free & Fast</p>
  </div>
  <div class="fb-body">
    <div class="fb-input-wrap">
      <input id="fbUrl" type="text" placeholder="Paste Facebook video link here..."/>
      <button class="fb-btn" onclick="pasteLink()">Paste</button>
    </div>
    <button id="dlBtn" class="fb-btn" style="width:100%;margin-top:12px;padding:14px;font-size:16px" onclick="downloadFB()">Download Video</button>
    
    <div id="fbResult"></div>

    <div class="fb-how">
      <div><b>1. Copy Link</b><span style="font-size:12px;color:#64748b">Copy Facebook video URL</span></div>
      <div><b>2. Paste Link</b><span style="font-size:12px;color:#64748b">Paste in above box</span></div>
      <div><b>3. Download HD</b><span style="font-size:12px;color:#64748b">Click download button</span></div>
    </div>
    
    <p style="font-size:11px;color:#94a3b8;text-align:center;margin-top:16px">Worker: Active ✅ | Supports Reels, Videos, fb.watch, Public Groups</p>
  </div>
</div>

<script>
const WORKER_URL = "https://frosty-cloud-8b5e.irfanbhatti9178.workers.dev/";

async function pasteLink(){
  try{
    const text = await navigator.clipboard.readText();
    document.getElementById('fbUrl').value = text;
  }catch(e){ 
    document.getElementById('fbUrl').focus(); 
  }
}

// Force Download function (TikTok style - XHR + Blob)
function forceDownload(url, filename) {
  const btn = event.target;
  const originalText = btn.innerText;
  btn.innerText = "Downloading...";
  btn.disabled = true;

  const xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.responseType = 'blob';

  xhr.onload = function() {
    if (xhr.status === 200) {
      const blob = xhr.response;
      const blobUrl = window.URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      
      window.URL.revokeObjectURL(blobUrl);
      document.body.removeChild(a);
    } else {
      alert("Download failed. Status: " + xhr.status);
    }
    btn.innerText = originalText;
    btn.disabled = false;
  };

  xhr.onerror = function() {
    alert("Download error. Please try again.");
    btn.innerText = originalText;
    btn.disabled = false;
  };

  xhr.send();
}

async function downloadFB(){
  const url = document.getElementById('fbUrl').value.trim();
  const resDiv = document.getElementById('fbResult');
  const btn = document.getElementById('dlBtn');
  
  if(!url){
    resDiv.innerHTML = '<div class="error">Please paste Facebook video URL first!</div>';
    return;
  }
  if(!url.includes('facebook.com') && !url.includes('fb.watch')){
    resDiv.innerHTML = '<div class="error">Please enter valid Facebook link (facebook.com or fb.watch)</div>';
    return;
  }

  btn.innerText = "Fetching...";
  btn.disabled = true;
  resDiv.innerHTML = '<div class="success">⏳ Fetching video... Please wait</div>';

  try{
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({url: url})
    });
    const data = await res.json();

    if(data.error){
      resDiv.innerHTML = `<div class="error">❌ ${data.error}<br><small>Tip: Only public videos work.</small></div>`;
      btn.innerText = "Download Video";
      btn.disabled = false;
      return;
    }

    const safeTitle = (data.title || 'facebook-video')
      .replace(/[^\w\s-]/g, '')
      .replace(/\s+/g, '-')
      .substring(0, 40);

    // Proxy URLs
    const proxyHD = `\( {WORKER_URL}proxy?url= \){encodeURIComponent(data.hd)}&filename=${encodeURIComponent(safeTitle + '-HD.mp4')}`;
    const proxySD = `\( {WORKER_URL}proxy?url= \){encodeURIComponent(data.sd)}&filename=${encodeURIComponent(safeTitle + '-SD.mp4')}`;

    resDiv.innerHTML = `
      <div class="fb-card">
        <img src="${data.thumbnail || 'https://via.placeholder.com/320x180?text=FB+Video'}" onerror="this.src='https://via.placeholder.com/320x180?text=FB+Video'">
        <div>
          <b style="font-size:14px;line-height:1.4;display:block">${data.title || 'Facebook Video'}</b>
          <span style="font-size:12px;color:#64748b">Ready to download</span>
          <div class="fb-dl">
            <button onclick="forceDownload('\( {proxyHD}', ' \){safeTitle}-HD.mp4')">Download HD</button>
            <button class="sd" onclick="forceDownload('\( {proxySD}', ' \){safeTitle}-SD.mp4')">Download SD</button>
          </div>
        </div>
      </div>
      <div class="success" style="margin-top:10px">✅ Video found! Click button → Download seedha start hoga</div>
    `;
    btn.innerText = "Download Video";
    btn.disabled = false;

  }catch(e){
    resDiv.innerHTML = `<div class="error">❌ Error: ${e.message}</div>`;
    btn.innerText = "Download Video";
    btn.disabled = false;
  }
}
</script>

</body>
</html>
